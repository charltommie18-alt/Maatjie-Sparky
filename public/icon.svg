<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A3D" />
      <stop offset="100%" stop-color="#FF5722" />
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF6D6" />
      <stop offset="100%" stop-color="#FFE082" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7C2D12" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Magical sparkles in background -->
  <path d="M120 100 L128 120 L148 128 L128 136 L120 156 L112 136 L92 128 L112 120 Z" fill="#FFE082" opacity="0.8"/>
  <path d="M400 110 L406 126 L422 132 L406 138 L400 154 L394 138 L378 132 L394 126 Z" fill="#FFE082" opacity="0.8"/>
  <path d="M80 380 L85 394 L99 399 L85 404 L80 418 L75 404 L61 399 L75 394 Z" fill="#FFE082" opacity="0.6"/>

  <!-- Heart EQ badge -->
  <g transform="translate(370, 360) scale(1.3)" filter="url(#shadow)">
    <circle cx="20" cy="20" r="28" fill="#EC4899"/>
    <path d="M20 30 C12 22 8 16 12 12 C16 8 20 12 20 14 C20 12 24 8 28 12 C32 16 28 22 20 30 Z" fill="#FFFFFF"/>
  </g>

  <!-- Math 1 2 3 Star badge -->
  <g transform="translate(60, 360) scale(1.3)" filter="url(#shadow)">
    <circle cx="20" cy="20" r="28" fill="#3B82F6"/>
    <text x="20" y="27" font-family="'Nunito', sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle">+÷×</text>
  </g>

  <!-- Companion Ears -->
  <ellipse cx="170" cy="170" rx="46" ry="68" transform="rotate(-25 170 170)" fill="#E65100"/>
  <ellipse cx="170" cy="170" rx="30" ry="48" transform="rotate(-25 170 170)" fill="#FFCC80"/>

  <ellipse cx="342" cy="170" rx="46" ry="68" transform="rotate(25 342 170)" fill="#E65100"/>
  <ellipse cx="342" cy="170" rx="30" ry="48" transform="rotate(25 342 170)" fill="#FFCC80"/>

  <!-- Main Head -->
  <circle cx="256" cy="270" r="142" fill="url(#faceGrad)" filter="url(#shadow)"/>

  <!-- Cheeks -->
  <ellipse cx="176" cy="295" rx="24" ry="14" fill="#FF8A80" opacity="0.65"/>
  <ellipse cx="336" cy="295" rx="24" ry="14" fill="#FF8A80" opacity="0.65"/>

  <!-- Big happy eyes with highlights -->
  <ellipse cx="206" cy="250" rx="20" ry="26" fill="#263238"/>
  <circle cx="212" cy="242" r="8" fill="#FFFFFF"/>
  <circle cx="201" cy="260" r="4" fill="#FFFFFF"/>

  <ellipse cx="306" cy="250" rx="20" ry="26" fill="#263238"/>
  <circle cx="312" cy="242" r="8" fill="#FFFFFF"/>
  <circle cx="301" cy="260" r="4" fill="#FFFFFF"/>

  <!-- Cute little nose -->
  <path d="M250 274 Q256 268 262 274 Q256 280 250 274 Z" fill="#D84315"/>

  <!-- Joyful smiling mouth -->
  <path d="M236 292 Q256 322 276 292" fill="none" stroke="#3E2723" stroke-width="6" stroke-linecap="round"/>

  <!-- Little head antenna / spark light -->
  <path d="M256 128 L256 90" stroke="#FFD54F" stroke-width="8" stroke-linecap="round"/>
  <circle cx="256" cy="80" r="16" fill="#FFD54F"/>
</svg>
