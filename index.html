    <script>
      // Gracefully ignore Vite dev HMR WebSocket disconnection errors in cloud preview iframe
      window.addEventListener('error', function(e) {
        if (e && (e.message?.includes('WebSocket') || e.message?.includes('closed without opened') || e.filename?.includes('@vite/client'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e && (String(e.reason)?.includes('WebSocket') || String(e.reason)?.includes('closed without opened'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
    </script>
